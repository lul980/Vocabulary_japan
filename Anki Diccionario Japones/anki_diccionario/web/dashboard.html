<div class="adic" id="adic">
  <header class="cover">
    <div class="daisen" aria-hidden="true"><span>単語帳</span></div>
    <div class="cover-text">
      <h1 data-i18n="title">Diccionario japonés</h1>
      <p data-i18n="subtitle">Tu progreso con el vocabulario de Anki</p>
    </div>
    <div class="cover-controls">
      <label class="deck-picker">
        <span class="sr-only" data-i18n="deckLabel">Mazo</span>
        <select id="deck-select" disabled></select>
      </label>
      <button type="button" id="refresh" class="cover-button" data-i18n="refresh">Actualizar</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <div class="tabs-inner">
      <button type="button" role="tab" id="tab-progress" aria-controls="panel-progress" aria-selected="true" data-i18n="tabProgress">Progreso</button>
      <button type="button" role="tab" id="tab-dictionary" aria-controls="panel-dictionary" aria-selected="false" tabindex="-1" data-i18n="tabDictionary">Diccionario</button>
      <button type="button" role="tab" id="tab-review" aria-controls="panel-review" aria-selected="false" tabindex="-1" data-i18n="tabReview">Repasar</button>
    </div>
  </nav>

  <main id="page" aria-busy="true">
    <div class="page tab-panel" id="panel-progress" role="tabpanel" aria-labelledby="tab-progress">
      <p class="loading" id="loading" data-i18n="loading">Leyendo tu mazo…</p>

      <section class="hero" id="hero" hidden>
        <div class="hero-figure">
          <span class="hero-number" id="known-count">0</span>
          <p class="hero-caption" id="hero-caption"></p>
        </div>
        <div class="hero-side" id="hero-side"></div>
      </section>

      <section class="progress" id="progress" hidden>
        <div class="segbar" id="segbar" role="img"></div>
        <ul class="legend" id="legend"></ul>
        <p class="note" id="definition-note"></p>
      </section>

      <section class="deckmap" id="deckmap" hidden>
        <div class="section-head">
          <div>
            <h2 data-i18n="mapTitle">Tu mazo, palabra por palabra</h2>
            <p class="section-sub" id="map-sub"></p>
          </div>
          <div class="toggle" role="group" id="order-toggle">
            <button type="button" data-order="deck" aria-pressed="true" data-i18n="orderDeck">Orden del mazo</button>
            <button type="button" data-order="status" aria-pressed="false" data-i18n="orderStatus">Por estado</button>
          </div>
        </div>
        <div class="grid-wrap" id="grid-wrap">
          <canvas id="grid" tabindex="0" role="img"></canvas>
          <div class="tip" id="tip" hidden></div>
        </div>
      </section>

      <section class="cats" id="cats" hidden>
        <h2 class="cats-heading">
          <button type="button" class="cats-toggle" id="cats-toggle" aria-expanded="false" aria-controls="cats-body">
            <span class="cats-title" data-i18n="catsTitle">Por categoría</span>
            <span class="cats-summary" id="cats-summary"></span>
            <span class="cats-action" id="cats-action" data-i18n="catsShow">Ver todas</span>
            <svg class="chev" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </h2>
        <div class="cats-body" id="cats-body">
          <div class="cats-inner">
            <div class="cats-panel">
              <p class="section-sub" id="cats-sub"></p>
              <ul class="cat-list" id="cat-list"></ul>
              <p class="note" id="cats-note"></p>
            </div>
          </div>
        </div>
      </section>

      <div id="lower" hidden>
        <section class="rhythm">
          <h2 data-i18n="rhythmTitle">Palabras nuevas por semana</h2>
          <div class="rhythm-body">
            <div class="chart" id="week-chart"></div>
            <p class="projection" id="projection"></p>
          </div>
        </section>

        <section class="lists">
          <div class="wordlist">
            <div class="list-head">
              <h2 data-i18n="recentTitle">Recién aprendidas</h2>
              <button type="button" class="link-button" id="see-recent" data-i18n="seeAll">Ver todas</button>
            </div>
            <ol id="recent-list"></ol>
          </div>
          <div class="wordlist">
            <div class="list-head">
              <h2 data-i18n="hardTitle">Te cuestan trabajo</h2>
              <span class="list-links">
                <button type="button" class="link-button" id="review-hard" data-i18n="reviewThese">Repasarlas</button>
                <button type="button" class="link-button" id="see-hard" data-i18n="seeAll">Ver todas</button>
              </span>
            </div>
            <ol id="hard-list"></ol>
          </div>
        </section>
      </div>

      <section class="empty" id="empty" hidden>
        <h2 id="empty-title"></h2>
        <p id="empty-body"></p>
      </section>
    </div>

    <div class="page tab-panel" id="panel-dictionary" role="tabpanel" aria-labelledby="tab-dictionary" hidden>
      <section class="dict" id="dict">
        <div class="dict-tools">
          <label class="dict-search">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="sr-only" id="dict-q-label">Buscar</span>
            <input type="search" id="dict-q" autocomplete="off" spellcheck="false" aria-labelledby="dict-q-label">
          </label>
          <div class="dict-filters">
            <div class="toggle dict-status" role="group" id="dict-status"></div>
            <div class="dict-selects">
              <label class="dict-select"><span id="dict-cat-label">Categoría</span><select id="dict-cat"></select></label>
              <label class="dict-select"><span id="dict-jlpt-label">JLPT</span><select id="dict-jlpt"></select></label>
              <label class="dict-select"><span id="dict-sort-label">Ordenar</span><select id="dict-sort"></select></label>
            </div>
          </div>
        </div>

        <div class="dict-meta">
          <p class="dict-count" id="dict-count" aria-live="polite"></p>
          <div class="dict-active" id="dict-active"></div>
          <button type="button" class="link-button" id="dict-clear" hidden>Quitar filtros</button>
        </div>

        <ol class="dict-list" id="dict-list"></ol>
        <button type="button" class="dict-more" id="dict-more" hidden></button>

        <div class="dict-empty" id="dict-empty" hidden>
          <h2 id="dict-empty-title"></h2>
          <p id="dict-empty-body"></p>
          <button type="button" class="link-button" id="dict-empty-clear"></button>
        </div>
      </section>
    </div>
    <div class="page tab-panel" id="panel-review" role="tabpanel" aria-labelledby="tab-review" hidden>
      <section class="review" id="review">
        <div id="review-setup">
          <h2 class="review-title" id="review-setup-title">Repaso rápido</h2>
          <p class="review-intro" id="review-setup-body"></p>
          <h3 class="review-label" id="review-group-label"></h3>
          <div class="review-groups" id="review-groups"></div>
          <h3 class="review-label" id="review-amount-label"></h3>
          <div class="review-amount-row">
            <div class="toggle review-amounts" role="group" id="review-amounts" aria-labelledby="review-amount-label"></div>
            <input type="number" class="review-custom" id="review-custom" min="1" inputmode="numeric" aria-labelledby="review-amount-label" hidden>
          </div>
          <button type="button" class="review-btn is-main review-start" id="review-start"></button>
        </div>

        <div id="review-session" hidden>
          <div class="review-top">
            <span class="review-progress" id="review-progress-text"></span>
            <span class="review-score" id="review-score"></span>
            <button type="button" class="link-button" id="review-finish"></button>
          </div>
          <div class="review-track"><span id="review-bar"></span></div>
          <div class="review-card" id="review-card" aria-live="polite">
            <div class="review-word" id="review-word" lang="ja"></div>
            <div class="review-answer" id="review-answer" hidden></div>
          </div>
          <div class="review-actions" id="review-actions"></div>
          <p class="review-keys" id="review-keys"></p>
        </div>

        <div id="review-result" hidden>
          <h2 class="review-title" id="review-result-title"></h2>
          <div class="segbar review-result-bar" id="review-result-bar"></div>
          <p class="review-intro" id="review-result-body"></p>
          <div class="review-result-actions">
            <button type="button" class="review-btn is-main" id="review-retry"></button>
            <button type="button" class="review-btn" id="review-again"></button>
          </div>
          <h3 class="review-label" id="review-missed-title"></h3>
          <ol class="review-missed" id="review-missed"></ol>
        </div>
      </section>
    </div>
  </main>

  <footer class="source" id="source" hidden>
    <details>
      <summary data-i18n="sourceTitle">Cómo se leyó tu mazo</summary>
      <div id="source-body"></div>
    </details>
  </footer>
</div>
